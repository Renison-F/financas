name: Flutter (SerenaCash)
on:
  push:
    branches: [main, 'refactor/**', 'claude/**']
    paths: ['apps/serenacash_flutter/**', 'docs/flutter-migration/fixtures/**', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['apps/serenacash_flutter/**', 'docs/flutter-migration/fixtures/**', '.github/workflows/flutter.yml']
defaults:
  run:
    working-directory: apps/serenacash_flutter
jobs:
  gates:
    name: format · analyze · test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: apps/serenacash_flutter/coverage/lcov.info
  android:
    name: build apk (debug)
    runs-on: ubuntu-latest
    needs: gates
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: serenacash-debug-apk
          path: apps/serenacash_flutter/build/app/outputs/flutter-apk/app-debug.apk
