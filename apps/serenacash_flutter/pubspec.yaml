name: serenacash
description: "SerenaCash: finanças pessoais e compras de supermercado, sem ansiedade."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # estado e navegação
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  # modelos
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  meta: ^1.19.0
  collection: ^1.19.1
  uuid: ^4.6.0
  decimal: ^3.2.6
  intl: ^0.20.3
  # persistência
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  sqlite3: ^3.8.0
  path_provider: ^2.1.6
  path: ^1.9.0
  # segurança
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  cryptography: ^2.9.0
  crypto: ^3.0.8
  # integrações nativas
  mobile_scanner: ^7.5.0
  google_mlkit_text_recognition: ^0.17.1
  purchases_flutter: ^11.0.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  # arquivos
  share_plus: ^13.3.1
  file_picker: ^13.3.2
  pdf: ^3.13.1
  printing: ^5.15.1
  # UI
  fl_chart: ^1.3.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  drift_dev: ^2.35.2
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
    - assets/fixtures/
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Variable.ttf

# Banco cifrado: o hook nativo do package:sqlite3 baixa a build SQLCipher (community edition).
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
