<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Símbolo Cabe: uma peça encaixada com folga dentro de uma moldura">
  <!-- Moldura (outer frame) with an opening at the top-right: the piece has just slid in -->
  <path d="M40 8 H16 C11.58 8 8 11.58 8 16 V48 C8 52.42 11.58 56 16 56 H48 C52.42 56 56 52.42 56 48 V24" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <!-- Peça (inner piece) settled with a 4-unit gap -->
