/* Pouso — camada de identidade visual. Mantém as classes originais dos módulos e a compatibilidade das telas. */
:root{
  --ink:#1d3832;--muted:#6b8178;--purple:#1e6555;--purple-deep:#154f43;
  --berry:#bd755b;--green:#218366;--cream:#f5f7f3;--orange:#e7aa7f;

  --shadow:#163d2e0b;--soft:#e5f1e9;--field:#fff;--red:#b75d58;--gold:#a77a37;
  --cyan:#4c91a2;--glass:#fffffff2;--overlay:#102d25bb;
  --dash-hero:#184e42;--dash-hero-light:#d3e9dc;--radius:20px;
}
:root[data-theme="dark"]{
  color-scheme:dark;--ink:#ebf4ec;--muted:#adc2b6;--purple:#8ad5b5;--purple-deep:#9bdec2;
  --berry:#e0a083;--green:#7bceaa;--cream:#121e1b;--orange:#e5ac85;
  --stroke:#344c41;--surface:#1b2a24;--surface2:#22362d;
  --shadow:#00000029;--soft:#2b4336;--field:#23372e;--red:#f09c98;--gold:#e9c183;
  --cyan:#8dd6df;--glass:#1b2a24f2;--overlay:#080f0ce8;
  --dash-hero:#225a4b;--dash-hero-light:#d4f0df;
}

}

<script>
(()=>{'use strict';
const KEY='pouso-financas-v2', $$=(s,root=document)=>[...root.querySelectorAll(s)], $=(s)=>document.querySelector(s);
const icons={dashboard:'house',accounts:'wallet',transactions:'arrows',cards:'credit-card',mia:'sparkles',budgets:'pie',goals:'target',reports:'file',charts:'chart',categories:'layers',calendar:'calendar',tags:'tag',loans:'hand',openfinance:'link',tools:'wrench',settings:'settings',plans:'crown',help:'help',about:'info'};
const titles={dashboard:'Meu início',accounts:'Minhas contas',transactions:'Transações',cards:'Cartões de crédito',mia:'Leitura financeira',budgets:'Orçamentos',goals:'Objetivos',reports:'Relatórios',charts:'Gráficos',categories:'Categorias',calendar:'Calendário financeiro',tags:'Tags',loans:'Empréstimos',openfinance:'Open Finance',tools:'Ferramentas',settings:'Configurações',plans:'Planos e preços',help:'Central de ajuda',about:'Sobre o Pouso'};
const sections=[['Meu dinheiro',[['dashboard','Início'],['accounts','Contas'],['transactions','Transações'],['cards','Cartões de crédito'],['mia','Análises']]],['Planejar',[['budgets','Orçamentos'],['goals','Objetivos']]],['Analisar',[['reports','Relatórios'],['charts','Gráficos'],['categories','Categorias'],['calendar','Calendário']]],['Mais',[['tags','Tags'],['loans','Empréstimos'],['openfinance','Open Finance'],['tools','Ferramentas'],['settings','Configurações'],['plans','Planos e preços'],['help','Ajuda'],['about','Sobre']]]];
const colors=['#cb856a','#318566','#9b87a9','#d2a268','#599b9d','#d49b7f','#7d8fbb','#8daba1'];
const initialCats=[['Alimentação','expense','🍽️',colors[0]],['Moradia','expense','🏠',colors[2]],['Transporte','expense','🚗',colors[4]],['Saúde','expense','💊',colors[1]],['Educação','expense','📚',colors[3]],['Lazer','expense','🎮',colors[5]],['Compras','expense','🛍️',colors[6]],['Outros gastos','expense','📦',colors[7]],['Salário','income','💼',colors[1]],['Freelance','income','💻',colors[4]],['Rendimentos','income','💹',colors[3]],['Outras receitas','income','💰',colors[2]]];
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id'+Date.now().toString(36)+Math.random().toString(36).slice(2);
const iso=(d=new Date())=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const date=(s)=>new Date((s||iso())+'T12:00:00');
const ym=(d)=>iso(d).slice(0,7),monthDate=(key)=>new Date(Number(key.slice(0,4)),Number(key.slice(5,7))-1,1,12);
const plusMonths=(s,n)=>{const d=date(s),day=d.getDate(),t=new Date(d.getFullYear(),d.getMonth()+n,1,12);t.setDate(Math.min(day,new Date(t.getFullYear(),t.getMonth()+1,0).getDate()));return iso(t)};
const money=(n)=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0);
const num=(n)=>new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1}).format(Number(n)||0);
const shortDate=(s)=>date(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
const fullDate=(s)=>date(s).toLocaleDateString('pt-BR');
const monthLabel=(key)=>monthDate(key).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const attr=esc;
const rnd=(n)=>Math.round((Number(n)+Number.EPSILON)*100)/100;
const amount=(s)=>{const txt=String(s??'').trim();return Number(txt.replace(',','.'))};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function defaultData(){return {version:1,prefs:{name:'Meu espaço',theme:'light'},accounts:[{id:uid(),name:'Carteira principal',type:'cash',balance:0,color:colors[2]}],categories:initialCats.map(c=>({id:uid(),name:c[0],type:c[1],icon:c[2],color:c[3]})),cards:[],transactions:[],budgets:[],goals:[],loans:[],tags:[]}}
let data;let memoryOnly=false;try{const raw=localStorage.getItem(KEY);data=raw?JSON.parse(raw):defaultData();}catch(e){data=defaultData();memoryOnly=true;}
if(!data||typeof data!=='object'||!Array.isArray(data.transactions)||!Array.isArray(data.accounts))data=defaultData();
for(const k of ['accounts','categories','cards','transactions','budgets','goals','loans','tags'])if(!Array.isArray(data[k]))data[k]=[];
if(!data.prefs||typeof data.prefs!=='object')data.prefs={name:'Meu espaço',theme:'light'};
let route=(location.hash||'#/dashboard').slice(2).split('?')[0];if(!titles[route])route='dashboard';let period=ym(new Date());let query='',typeFilter='all',toastTimer=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));memoryOnly=false;return true;}catch(e){memoryOnly=true;toast('Armazenamento indisponível: alterações apenas nesta sessão.');return false;}}
function persist(){save();render()}
const get=(k,id)=>data[k].find(x=>x.id===id);
const cat=(id)=>get('categories',id);
const labelCat=(id)=>cat(id)?.name||'Sem categoria';
const accountName=(id)=>get('accounts',id)?.name||'Conta removida';
const cardName=(id)=>get('cards',id)?.name||'Cartão removido';
const txMonth=(t)=>t.date?.slice(0,7);
const monthTx=(key=period)=>data.transactions.filter(t=>txMonth(t)===key);
const categorized=(t)=>['expense','card_expense','income'].includes(t.type);
const effective=(t)=>t.paid!==false||t.type==='card_expense';
const expenses=(key=period,includePending=false)=>monthTx(key).filter(t=>['expense','card_expense'].includes(t.type)&&(includePending||effective(t)));
const incomes=(key=period,includePending=false)=>monthTx(key).filter(t=>t.type==='income'&&(includePending||effective(t)));
const total=(arr)=>rnd(arr.reduce((sum,t)=>sum+(Number(t.amount)||0),0));
function balance(id){const a=get('accounts',id);if(!a)return 0;let b=Number(a.balance)||0;for(const t of data.transactions){if(!effective(t))continue;switch(t.type){case'income':if(t.accountId===id)b+=t.amount;break;case'expense':if(t.accountId===id)b-=t.amount;break;case'transfer':if(t.accountId===id)b-=t.amount;if(t.toAccountId===id)b+=t.amount;break;case'card_payment':case'goal_deposit':case'loan_payment':if(t.accountId===id)b-=t.amount;break;case'goal_withdraw':case'loan_in':if(t.accountId===id)b+=t.amount;break;}}return rnd(b)}
function allBalances(){return rnd(data.accounts.reduce((s,a)=>s+balance(a.id),0))}
function invKey(t,c){const d=date(t.date),closing=Number(c?.closing)||20,due=Number(c?.due)||10;const dueDate=new Date(d.getFullYear(),d.getMonth()+(d.getDate()>closing?2:1),Math.min(due,28),12);return ym(dueDate)}
function invoice(c,key){const purchases=data.transactions.filter(t=>t.type==='card_expense'&&t.cardId===c.id&&invKey(t,c)===key);const payments=data.transactions.filter(t=>t.type==='card_payment'&&t.cardId===c.id&&t.invoiceKey===key&&effective(t));return {key,purchases,payments,total:total(purchases),paid:total(payments),pending:rnd(total(purchases)-total(payments))}}
function cardDebt(c){const charges=total(data.transactions.filter(t=>t.type==='card_expense'&&t.cardId===c.id));const payments=total(data.transactions.filter(t=>t.type==='card_payment'&&t.cardId===c.id&&effective(t)));return rnd(charges-payments)}
function monthStats(key=period){const inc=incomes(key),out=expenses(key),plannedI=incomes(key,true),plannedO=expenses(key,true);return {income:total(inc),expense:total(out),plannedIncome:total(plannedI),plannedExpense:total(plannedO),balance:rnd(total(inc)-total(out)),card:total(monthTx(key).filter(t=>t.type==='card_expense'))}}
function categoryTotals(key=period){const map={};for(const t of expenses(key)){map[t.categoryId]=(map[t.categoryId]||0)+Number(t.amount)}return Object.entries(map).map(([id,value])=>({id,name:labelCat(id),value:rnd(value),color:cat(id)?.color||colors[6]})).sort((a,b)=>b.value-a.value)}
function lastMonths(n=6){const d=monthDate(period);return Array.from({length:n},(_,i)=>ym(new Date(d.getFullYear(),d.getMonth()-n+i+1,1,12)))}
function goalSaved(id){return rnd(total(data.transactions.filter(t=>t.type==='goal_deposit'&&t.goalId===id))-total(data.transactions.filter(t=>t.type==='goal_withdraw'&&t.goalId===id)))}
function installment(l){const p=Number(l.principal)||0,r=(Number(l.rate)||0)/1200,n=Number(l.months)||1;return r===0?p/n:p*r/(1-Math.pow(1+r,-n))}
function loanPaid(l){return data.transactions.filter(t=>t.type==='loan_payment'&&t.loanId===l.id&&effective(t)).length}
function empty(icon,title,desc,action='',label='Começar agora'){return `<div class="empty"><div class="empty-icon">${icon}</div><h3>${title}</h3><p>${desc}</p>${action?`<button class="btn primary" data-action="${action}">${label}</button>`:''}</div>`}
function pill(text,mode=''){return `<span class="chip ${mode}">${esc(text)}</span>`}
function h(title,sub='',button=''){return `<div class="section-head"><div><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div><div class="head-actions">${button}</div></div>`}
function actionBtn(action,label='Adicionar',color='primary',attrs=''){return `<button class="btn ${color}" data-action="${action}" ${attrs}>${label}</button>`}
function rowIcon(emoji,color){return `<span class="bubble" style="background:${color||'#f0e4ff'}2b;color:${color||'#8651ae'}">${emoji}</span>`}
function pIcon(name){const P={
 house:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/>',
 wallet:'<rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 9h18M16 14h2"/>',
 arrows:'<path d="M7 7h14m-4-4 4 4-4 4M17 17H3m4-4-4 4 4 4"/>',
 'credit-card':'<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/>',
 sparkles:'<path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM5 17l.9 2.1L8 20l-2.1.9L5 23l-.9-2.1L2 20l2.1-.9z"/>',
 pie:'<path d="M12 3v9h9"/><path d="M20 15a9 9 0 1 1-11-11"/>',
 target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
 file:'<path d="M6 3h9l4 4v14H6zM15 3v5h4M9 12h7M9 16h7"/>',
 chart:'<path d="M3 20h18M5 16l5-5 4 3 5-8"/>',
 layers:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/>',
 calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 11h18"/>',
 tag:'<path d="M3 4h9l9 9-8 8-10-10z"/><circle cx="8" cy="9" r="1"/>',
 hand:'<path d="M3 17c3-2 5-2 8 0l2 1 6-4a2 2 0 0 1 2 3l-8 5-7-2H3zM9 4h9v9H9zM13 6v5"/>',
 link:'<path d="M10 13a5 5 0 0 0 7 .4l2-2a5 5 0 0 0-7-7l-1.5 1.5M14 11a5 5 0 0 0-7-.4l-2 2a5 5 0 0 0 7 7l1.5-1.5"/>',
 wrench:'<path d="M14 6a6 6 0 0 0-8 8l-4 4a2 2 0 0 0 3 3l4-4a6 6 0 0 0 8-8l-4 4-3-3z"/>',
 settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4 4l2 2m12 12 2 2M2 12h3m14 0h3M4 20l2-2M18 6l2-2"/>',
 crown:'<path d="M3 8 8 13l4-8 4 8 5-5-2 12H5z"/>',
 help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a3 3 0 1 1 4.2 2.8c-1.4.7-1.7 1.2-1.7 2.7M12 18h.01"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',
 sliders:'<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="currentColor" stroke="none"/><circle cx="16" cy="17" r="2" fill="currentColor" stroke="none"/>',
 'arrow-down-left':'<path d="M18 6 6 18M6 9v9h9"/>',
 'arrow-up-right':'<path d="M6 18 18 6M9 6h9v9"/>',
 repeat:'<path d="m17 3 4 4-4 4M21 7H7a4 4 0 0 0-4 4m4 10-4-4 4-4M3 17h14a4 4 0 0 0 4-4"/>'
};return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(P[name]||P.info)+'</svg>';}
function renderNav(){let html='';for(const [name,items] of sections){html+=`<div class="nav-group">${name}</div>`;for(const [r,l] of items)html+=`<button class="nav-item ${route===r?'active':''}" ${route===r?'aria-current="page"':''} data-route="${r}"><span class="nav-icon" aria-hidden="true">${pIcon(icons[r])}</span>${l}</button>`;}$('#nav').innerHTML=html;$$('.mobile-tabbar [data-route]').forEach(b=>{const active=b.dataset.route===route;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('#profileName').textContent=data.prefs.name||'Meu espaço';$('#themeIcon').textContent=data.prefs.theme==='dark'?'☀':'☾';$('#themeText').textContent=data.prefs.theme==='dark'?'Modo claro':'Modo escuro'}
function render(){document.documentElement.dataset.theme=data.prefs.theme==='dark'?'dark':'light';renderNav();$('#topTitle').textContent=titles[route];$('#topSub').textContent=route==='dashboard'?'Seu dinheiro, com clareza':'Acompanhe, organize e planeje';$('#periodLabel').textContent=monthLabel(period);const fn=views[route]||dashboard;$('#view').innerHTML=(memoryOnly?`<div class="notice">⚠️ Seu navegador não permitiu salvar dados. Faça um backup JSON antes de sair.</div>`:'')+fn();}
function navigate(next){route=titles[next]?next:'dashboard';location.hash='#/'+route;query='';typeFilter='all';closeMenu();render();window.scrollTo({top:0,behavior:'instant'})}
function closeMenu(){$('#sidebar').classList.remove('open');$('#mobileShade').classList.remove('open');document.body.classList.remove('noscroll')}

function periodTimeline(){const now=new Date(),dateBase=monthDate(period);const same=ym(now)===period;const focus=same?now.getDate():Math.min(15,new Date(dateBase.getFullYear(),dateBase.getMonth()+1,0).getDate());let out='<div class="timeline">';for(let i=-3;i<=3;i++){let d=new Date(dateBase.getFullYear(),dateBase.getMonth(),focus+i,12);let current=iso(d)===iso(now);out+=`<div class="timeline-item ${current?'today':''}"><div>${d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')}</div><div class="timeline-day"></div><div>${d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</div></div>`}return out+'</div>'}
function statsCards(s){return `<div class="stat-grid"><div class="stat-card"><div class="stat-title">${rowIcon('+','#43a777')} Receitas</div><div class="stat-amount" style="color:var(--green)">${money(s.income)}</div><div class="stat-sub">Previstas: ${money(s.plannedIncome)}</div></div><div class="stat-card"><div class="stat-title">${rowIcon('−','#de6576')} Despesas</div><div class="stat-amount" style="color:var(--red)">${money(s.expense)}</div><div class="stat-sub">Previstas: ${money(s.plannedExpense)}</div></div><div class="stat-card"><div class="stat-title">${rowIcon('↕','#e5a035')} Balanço do mês</div><div class="stat-amount">${money(s.balance)}</div><div class="stat-sub">Receitas menos despesas efetivadas</div></div><div class="stat-card"><div class="stat-title">${rowIcon('▣','#4c97c2')} Cartões</div><div class="stat-amount">${money(data.cards.reduce((sum,c)=>sum+cardDebt(c),0))}</div><div class="stat-sub">Total em faturas ainda não pagas</div></div></div>`}
function txTitle(t){if(t.type==='transfer')return `${accountName(t.accountId)} → ${accountName(t.toAccountId)}`;if(t.type==='card_payment')return 'Pagamento de fatura · '+cardName(t.cardId);if(t.type==='goal_deposit')return 'Reserva para '+(get('goals',t.goalId)?.name||'Objetivo');if(t.type==='goal_withdraw')return 'Resgate de '+(get('goals',t.goalId)?.name||'Objetivo');if(t.type==='loan_in')return 'Crédito recebido · '+(get('loans',t.loanId)?.name||'Empréstimo');if(t.type==='loan_payment')return 'Parcela · '+(get('loans',t.loanId)?.name||'Empréstimo');return t.description||labelCat(t.categoryId)}
function txBadge(t){if(t.type==='income')return ['↗','#43a777'];if(t.type==='expense')return ['↘','#de6576'];if(t.type==='card_expense')return ['▣','#4c97c2'];if(t.type==='transfer')return ['↔','#e5a035'];if(t.type==='goal_deposit'||t.type==='goal_withdraw')return ['🎯','#a06ac4'];if(t.type==='loan_in'||t.type==='loan_payment')return ['🤝','#a06ac4'];return ['▣','#4c97c2']}
function txRow(t,opts={}){const [symbol,color]=txBadge(t),positive=['income','goal_withdraw','loan_in'].includes(t.type);const value=(positive?'+ ':['expense','card_expense','goal_deposit','loan_payment','card_payment'].includes(t.type)?'− ':'')+money(t.amount);return `<div class="data-row">${rowIcon(symbol,color)}<div class="row-body"><div class="row-title">${esc(txTitle(t))}</div><div class="row-caption">${shortDate(t.date)} · ${esc(['income','expense','card_expense'].includes(t.type)?labelCat(t.categoryId):t.type==='transfer'?'Transferência':t.type==='card_payment'?'Fatura':'Movimentação')} ${t.type==='card_expense'?' · '+esc(cardName(t.cardId)):''}</div></div><div><div class="row-value" style="color:${positive?'var(--green)':t.type==='transfer'?'var(--ink)':'var(--red)'}">${value}</div><div class="row-caption" style="text-align:right">${!effective(t)?pill('Previsto','gold'):pill('Efetivado','green')}</div></div>${opts.actions?`<div class="row-actions">${t.paid===false?`<button class="icon-btn" title="Efetivar" data-action="settle-tx" data-id="${t.id}">✓</button>`:''}${['income','expense','transfer','card_expense'].includes(t.type)?`<button class="icon-btn" title="Editar" data-action="edit-tx" data-id="${t.id}">✎</button>`:''}<button class="icon-btn" title="Excluir" data-action="delete-tx" data-id="${t.id}">×</button></div>`:''}</div>`}
function donutHTML(items){const sum=items.reduce((s,x)=>s+x.value,0);if(!sum)return empty('📊','Sem despesas no período','Registre uma despesa para visualizar a distribuição por categoria.','new-expense','Nova despesa');let totalPc=0;const segments=items.map(x=>{const start=totalPc;totalPc+=x.value/sum*100;return `${x.color} ${start}% ${totalPc}%`}).join(',');return `<div class="donut-wrap"><div class="donut" role="img" aria-label="Distribuição das despesas por categoria" style="background:conic-gradient(${segments})"><b>${money(sum)}</b></div><div class="legend">${items.slice(0,6).map(x=>`<div class="legend-item"><i class="dot" style="background:${x.color}"></i><span>${esc(x.name)}</span><b>${num(100*x.value/sum)}%</b></div>`).join('')}${items.length>6?'<div class="hint">Outras categorias também compõem o gráfico.</div>':''}</div></div>`}
function trendChart(type='expense'){const keys=lastMonths(6),values=keys.map(k=>type==='income'?monthStats(k).income:monthStats(k).expense),maximum=Math.max(1,...values)*1.15,x0=36,y0=14,w=560,h=180,loc=(v,i)=>[x0+(w/(keys.length-1))*i,y0+h-(v/maximum)*h],p=values.map((v,i)=>loc(v,i).join(',')).join(' ');return `<svg class="chart" viewBox="0 0 640 246" role="img" aria-label="Evolução mensal de ${type==='income'?'receitas':'despesas'} dos últimos 6 meses"><line class="axis" x1="36" y1="194" x2="615" y2="194"/><line class="axis" x1="36" y1="104" x2="615" y2="104"/><line class="axis" x1="36" y1="14" x2="615" y2="14"/><text x="6" y="17">${esc(num(maximum))}</text><text x="13" y="198">0</text><polyline class="line" points="${p}"/>${values.map((v,i)=>{const [x,y]=loc(v,i);return `<circle class="point" cx="${x}" cy="${y}" r="6"><title>${monthLabel(keys[i])}: ${money(v)}</title></circle><text text-anchor="middle" x="${x}" y="225">${monthDate(keys[i]).toLocaleDateString('pt-BR',{month:'short'})}</text>`}).join('')}</svg>`}
function savingsHTML(s){const pct=s.income?clamp((s.income-s.expense)/s.income*100,-999,100):0;const gain=rnd(s.income-s.expense);return `<div class="line-row"><h2 class="card-title">📈 Economia mensal</h2>${pill(gain>=0?'Saldo positivo':'Atenção ao saldo',gain>=0?'green':'red')}</div><div class="two-cols" style="align-items:center;margin-top:15px"><div style="text-align:center"><div class="gauge"><svg viewBox="0 0 180 103" width="160" height="96" role="img" aria-label="Taxa de economia: ${Math.round(pct)} por cento"><path d="M 20 88 A 70 70 0 0 1 160 88" fill="none" stroke="var(--soft)" stroke-width="16" stroke-linecap="round"/><path d="M 20 88 A 70 70 0 0 1 160 88" fill="none" stroke="var(--berry)" stroke-width="16" stroke-linecap="round" pathLength="100" stroke-dasharray="${clamp(pct,0,100)} 100"/></svg><strong>${Math.round(pct)}%</strong></div><div class="eyebrow">de economia</div><div class="stat-amount">${money(gain)}</div><div class="hint">Receitas − despesas do mês</div></div><div><div class="mini-metric"><span>Receitas consideradas</span><b style="color:var(--green)">${money(s.income)}</b></div><div class="mini-metric"><span>Despesas consideradas</span><b style="color:var(--red)">${money(s.expense)}</b></div><div class="divider"></div><div class="hint">Somente lançamentos efetivados. Compras no cartão entram na data da compra, e o pagamento da fatura não é contado novamente como despesa.</div></div></div>`}

function pFinancialAvailability(){

 const outstanding=data.transactions.filter(t=>t.type==='expense'&&t.paid===false&&t.date<=cutoff);
 const due=total(outstanding);const cards=rnd(data.cards.reduce((s,c)=>s+Math.max(0,cardDebt(c)),0));

 modal('Como calculamos seu dinheiro livre',`<p class="hint">Este é um cálculo conservador, não uma consulta ao banco.</p><div class="rowlist"><div class="data-row"><div class="row-body"><b>Saldo das contas cadastradas</b><div class="hint">Saldo inicial + movimentações efetivadas</div></div><strong>${money(a.bank)}</strong></div><div class="data-row"><div class="row-body"><b>Despesas previstas ainda não pagas</b><div class="hint">Vencidas e com data até ${fullDate(a.cutoff)}</div></div><strong>− ${money(a.due)}</strong></div><div class="data-row"><div class="row-body"><b>Compras nos cartões ainda não pagas</b><div class="hint">Dívida registrada, inclusive parcelas futuras já lançadas</div></div><strong>− ${money(a.cards)}</strong></div><div class="data-row"><div class="row-body"><b>Margem de segurança escolhida</b><div class="hint">Dinheiro que você prefere não gastar</div></div><strong>− ${money(a.cushion)}</strong></div></div><div class="soft-card line-row" style="margin-top:13px"><b>Estimativa disponível</b><strong>${money(a.available)}</strong></div><p class="hint" style="margin-top:12px">Reservas para objetivos já movimentadas diminuem o saldo bancário automaticamente. A estimativa depende de você registrar todos os compromissos e atualizar os pagamentos; não inclui cobranças desconhecidas ou movimentações bancárias não cadastradas.</p><div class="form-actions"><button class="btn" data-action="configure-dashboard">Ajustar margem de segurança</button><button class="btn primary" data-action="close-modal">Entendi</button></div>`);
}
function dashboardConfigure(){
 const order=pDashOrder();const rows=order.map(id=>{const w=P_WIDGETS.find(x=>x.id===id);return `<div class="widget-config-row" data-widget="${id}"><label><input type="checkbox" name="widget" value="${id}" ${pDashVisible(id)?'checked':''}><span class="config-text"><b>${esc(w.name)}</b><small>${esc(w.sub)}</small></span></label><div class="order-actions"><button type="button" data-action="dash-up" aria-label="Mover ${esc(w.name)} para cima" title="Mover para cima">↑</button><button type="button" data-action="dash-down" aria-label="Mover ${esc(w.name)} para baixo" title="Mover para baixo">↓</button></div></div>`}).join('');
 modal('Personalizar minha tela inicial',`<form data-form="dashboard-config"><p class="config-intro">Marque o que deseja ver. Use as setas para alterar a ordem. A configuração será mantida neste navegador, inclusive após fechar o aplicativo.</p><div class="config-presets"><button type="button" data-action="dash-preset" data-preset="essential">Essencial</button><button type="button" data-action="dash-preset" data-preset="focus">Só o mais importante</button><button type="button" data-action="dash-preset" data-preset="complete">Mostrar tudo</button><button type="button" data-action="dash-preset" data-preset="none">Ocultar tudo</button></div><div class="config-options" id="pConfigOptions">${rows}</div><div class="config-form-foot"><label class="form-field">Dinheiro que quero deixar de segurança (R$)<input class="field" type="number" name="safetyCushion" step="0.01" min="0" max="1000000000" value="${attr(pCushion())}" required></label><label class="form-field">Espaçamento entre painéis<select class="select" name="dashboardDensity"><option value="comfortable" ${data.prefs.dashboardDensity!=='compact'?'selected':''}>Confortável</option><option value="compact" ${data.prefs.dashboardDensity==='compact'?'selected':''}>Compacto</option></select></label></div><p class="dash-config-note">O painel “Quanto posso gastar” é uma estimativa, calculada com os registros disponíveis.</p>${formActions()}</form>`,true);
}
function pMoveWidget(button,step){const row=button.closest('.widget-config-row'),holder=row?.parentElement;if(!holder)return;const sibling=step<0?row.previousElementSibling:row.nextElementSibling;if(!sibling)return;if(step<0)holder.insertBefore(row,sibling);else holder.insertBefore(sibling,row);}
function pPreset(name){const holder=$('#pConfigOptions');if(!holder)return;
 const essential=P_DEFAULT,focus=['available','due','recent','quick'];const selection=name==='complete'?P_WIDGETS.map(x=>x.id):name==='focus'?focus:name==='none'?[]:essential;
 holder.querySelectorAll('[data-widget]').forEach(row=>{const input=row.querySelector('input[name="widget"]');input.checked=selection.includes(row.dataset.widget)});
 const order=[...selection,...P_WIDGETS.map(x=>x.id).filter(id=>!selection.includes(id))];for(const id of order){const row=[...holder.children].find(x=>x.dataset.widget===id);if(row)holder.appendChild(row)}
}

function statusBreakdown(type){const arr=monthTx().filter(t=>type==='income'?t.type==='income':['expense','card_expense'].includes(t.type)),today=iso(),parts=[{name:'Efetivadas',value:total(arr.filter(effective)),color:'#43a777'},{name:'Próximas do vencimento',value:total(arr.filter(t=>!effective(t)&&t.date>=today&&date(t.date)-date(today)<=7*86400000)),color:'#e5a035'},{name:'Vencidas',value:total(arr.filter(t=>!effective(t)&&t.date<today)),color:'#de6576'},{name:'Distantes do vencimento',value:total(arr.filter(t=>!effective(t)&&date(t.date)-date(today)>7*86400000)),color:'#999999'}],sum=total(arr);return `<div class="rowlist">${parts.map(p=>`<div class="data-row">${rowIcon(sum?Math.round(p.value/sum*100)+'%':'0%',p.color)}<div class="row-body"><b>${p.name}</b></div><div class="row-value">${money(p.value)}</div></div>`).join('')}</div><div class="soft-card line-row" style="margin-top:10px"><b>Total ${type==='income'?'receita':'despesa'}</b><b>${money(sum)}</b></div>`}
function insights(){const s=monthStats(),notes=[];if(!data.transactions.filter(t=>['income','expense','card_expense'].includes(t.type)).length)return [{icon:'📋',title:'Comece pelo essencial',text:'Registre suas receitas e despesas para que as orientações tenham dados reais.'}];if(s.income>0){const rate=(s.income-s.expense)/s.income*100;notes.push(rate>=20?{icon:'📈',title:'Bom espaço para poupar',text:`Sua economia no mês é de ${num(rate)}% das receitas efetivadas.`}:rate>=0?{icon:'📉',title:'Há espaço para melhorar',text:`Sua economia no mês é de ${num(rate)}%. Planeje uma reserva mensal.`}:{icon:'⚠️',title:'Gastos acima das receitas',text:`As despesas do mês superaram as receitas em ${money(s.expense-s.income)}.`})}else if(s.expense>0)notes.push({icon:'🧭',title:'Cadastre suas receitas',text:'Há despesas registradas, mas nenhuma receita efetivada neste mês.'});const top=categoryTotals()[0];if(top&&s.expense>0)notes.push({icon:'🔍',title:'Maior categoria de gasto',text:`${top.name} representa ${num(top.value/s.expense*100)}% das despesas efetivadas de ${monthLabel(period)}.`});const over=data.budgets.filter(b=>total(expenses().filter(t=>t.categoryId===b.categoryId))>b.limit);if(over.length)notes.push({icon:'🚨',title:'Atenção aos orçamentos',text:`Você ultrapassou ${over.length} limite(s) por categoria neste mês.`});else if(data.budgets.length)notes.push({icon:'🎯',title:'Seu planejamento está no caminho',text:'Nenhum orçamento cadastrado foi ultrapassado neste mês.'});const debts=total(data.cards.map(c=>({amount:cardDebt(c)})));if(debts>0)notes.push({icon:'💳',title:'Acompanhe suas faturas',text:`Você possui ${money(debts)} em compras no cartão ainda não pagas.`});if(!data.budgets.length)notes.push({icon:'🧮',title:'Estabeleça limites',text:'Crie orçamentos por categoria para enxergar antecipadamente seus gastos.'});if(!data.goals.length)notes.push({icon:'🏆',title:'Crie um objetivo',text:'Separar um valor para uma meta ajuda a manter o foco.'});return notes}
function insightHTML(compact=false){const list=insights().slice(0,compact?2:99);return `<div class="rowlist">${list.map(i=>`<div class="soft-card"><b>${i.icon} ${esc(i.title)}</b><div class="hint" style="margin-top:5px">${esc(i.text)}</div></div>`).join('')}</div>`}
function healthHTML(){const count=data.transactions.filter(t=>['income','expense','card_expense'].includes(t.type)).length;const s=monthStats();if(count<2||(!s.income&&!s.expense))return `<div class="empty" style="padding:15px 5px"><div class="empty-icon">📊</div><h3>Ainda estamos conhecendo suas finanças</h3><p>Cadastre receitas e despesas efetivadas para visualizar indicadores de economia, planejamento, crédito, reserva e comprometimento.</p></div>`;const saving=s.income>0?clamp(50+(s.income-s.expense)/s.income*125,0,100):0;const planning=data.budgets.length?Math.round(100*data.budgets.filter(b=>total(expenses().filter(t=>t.categoryId===b.categoryId))<=b.limit).length/data.budgets.length):0;const reserve=data.goals.length?clamp(100*data.goals.reduce((n,g)=>n+Math.min(1,goalSaved(g.id)/g.target),0)/data.goals.length,0,100):0;const cardsDebt=total(data.cards.map(c=>({amount:cardDebt(c)})));const credit=data.cards.length?clamp(100-cardsDebt/Math.max(1,data.cards.reduce((n,c)=>n+c.limit,0))*100,0,100):0;const commitment=s.income?clamp(100-s.expense/s.income*100,0,100):0;const vals=[saving,planning,commitment,reserve,credit].map(v=>Number(v)||0);const coords=(pct)=>pct.map((v,i)=>{const a=-Math.PI/2+i*2*Math.PI/5,r=90*v/100;return [150+Math.cos(a)*r,130+Math.sin(a)*r].join(',')}).join(' ');return `<div class="two-cols" style="align-items:center"><svg class="radar-svg" viewBox="0 0 300 272" role="img" aria-label="Indicadores heurísticos: economia ${Math.round(saving)}, planejamento ${Math.round(planning)}, comprometimento ${Math.round(commitment)}, reserva ${Math.round(reserve)}, crédito ${Math.round(credit)}"><g>${[20,40,60,80,100].map(v=>`<polygon points="${coords(Array(5).fill(v))}"/>`).join('')}<polygon points="${coords(vals)}" fill="#f05b9150" stroke="#f05b91" stroke-width="2.5"/>${[0,1,2,3,4].map(i=>{const [x,y]=coords(vals).split(' ')[i].split(',');return `<circle cx="${x}" cy="${y}" r="4" fill="#f05b91"/>`}).join('')}<text x="150" y="19" text-anchor="middle">Economia</text><text x="247" y="102">Planejamento</text><text x="226" y="239">Comprometimento</text><text x="69" y="239">Reserva</text><text x="5" y="102">Crédito</text></g></svg><div><h3 style="margin:0 0 8px">Seu retrato financeiro</h3>${[['Economia',saving],['Planejamento',planning],['Comprometimento',commitment],['Reserva',reserve],['Crédito',credit]].map(([k,v])=>`<div class="mini-metric"><span>${k}</span><b>${Math.round(v)}/100</b></div><div class="progress-track" style="height:7px"><div class="progress-fill green" style="width:${v}%"></div></div>`).join('')}<p class="hint">Indicadores orientativos baseados em regras simples. Ausência de dados em uma dimensão aparece como zero; isto não representa um score de crédito nem aconselhamento profissional.</p></div></div>`}
function accountsView(){return `${h('🏦 Contas',`Saldo disponível total: ${money(allBalances())}`,actionBtn('new-account','+ Nova conta'))}<div class="item-grid">${data.accounts.map(a=>`<div class="item-card"><div class="line-row">${rowIcon('🏦',a.color)}${pill(a.type==='cash'?'Dinheiro':a.type==='savings'?'Poupança':'Conta bancária')}</div><h3>${esc(a.name)}</h3><div class="item-amount">${money(balance(a.id))}</div><div class="hint">Saldo inicial: ${money(a.balance)}</div><div class="item-foot"><button class="btn small" data-action="edit-account" data-id="${a.id}">Editar</button><button class="btn small danger" data-action="delete-account" data-id="${a.id}">Excluir</button></div></div>`).join('')}</div><div class="notice info" style="margin-top:18px">💡 Saldos refletem apenas movimentações efetivadas. Compras com cartão de crédito geram faturas, não débito imediato em conta.</div>`}
function transactionsView(){let arr=monthTx().filter(t=>typeFilter==='all'||t.type===typeFilter).filter(t=>[txTitle(t),labelCat(t.categoryId),accountName(t.accountId),t.memo||''].join(' ').toLowerCase().includes(query.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));return `${h('💸 Transações',`${arr.length} movimentação(ões) no período selecionado.`,actionBtn('quick','+ Novo lançamento'))}<div class="card"><div class="search-row"><input class="field" id="txSearch" placeholder="Buscar descrição, categoria ou conta..." value="${attr(query)}" aria-label="Pesquisar transações"><select class="select" id="txFilter" aria-label="Filtrar tipo"><option value="all">Todos os tipos</option>${[['income','Receitas'],['expense','Despesas'],['card_expense','Despesa cartão'],['transfer','Transferências'],['card_payment','Pagamentos de fatura'],['goal_deposit','Reservas'],['loan_payment','Empréstimos']].map(([t,l])=>`<option value="${t}" ${typeFilter===t?'selected':''}>${l}</option>`).join('')}</select></div>${arr.length?`<div class="rowlist">${arr.map(t=>txRow(t,{actions:true})).join('')}</div>`:empty('🧾','Nenhuma transação encontrada','Experimente outro mês ou adicione um lançamento.','quick','Adicionar lançamento')}</div>`}
function cardsView(){const unpaid=data.cards.reduce((s,c)=>s+cardDebt(c),0);return `${h('💳 Cartões de crédito',`Saldo total de faturas em aberto: ${money(unpaid)}.`,actionBtn('new-card','+ Adicionar cartão'))}<div class="item-grid">${data.cards.map(c=>{const debt=cardDebt(c),limit=Math.max(0,c.limit-debt),cycles=[...new Set([...data.transactions.filter(t=>t.type==='card_expense'&&t.cardId===c.id).map(t=>invKey(t,c)),...data.transactions.filter(t=>t.type==='card_payment'&&t.cardId===c.id).map(t=>t.invoiceKey)])].sort().reverse();const visible=cycles.length?cycles.slice(0,4):[ym(new Date())];return `<div class="item-card"><div class="line-row">${rowIcon('💳',c.color)}${pill('Fech. dia '+c.closing+' · Venc. dia '+c.due)}</div><h3>${esc(c.name)}</h3><div class="item-amount">${money(debt)}</div><div class="hint">Limite disponível: ${money(limit)} de ${money(c.limit)}</div><div class="progress-track" style="margin:12px 0"><div class="progress-fill ${debt>c.limit?'red':''}" style="width:${clamp(debt/Math.max(1,c.limit)*100,0,100)}%"></div></div><div class="eyebrow">Faturas</div>${visible.map(k=>{const f=invoice(c,k);return `<div class="line-row" style="margin:10px 0;gap:5px;font-size:12px"><span>${monthLabel(k)}</span><b>${money(f.pending)}</b><button class="btn small" data-action="pay-invoice" data-id="${c.id}" data-key="${k}" ${f.pending<=0?'disabled':''}>Pagar</button></div>`}).join('')}<div class="item-foot"><button class="btn small" data-action="new-card-expense" data-card-id="${c.id}">+ Compra</button><button class="btn small" data-action="edit-card" data-id="${c.id}">Editar</button><button class="btn small danger" data-action="delete-card" data-id="${c.id}">Excluir</button></div></div>`}).join('')}</div>${data.cards.length?'':`<div class="card">${empty('💳','Seu primeiro cartão','Cadastre o nome, o limite, o dia de fechamento e o vencimento.','new-card','Cadastrar cartão')}</div>`}<div class="notice info" style="margin-top:18px">ℹ️ Compras entram nas despesas pela data da compra. O pagamento de fatura diminui o saldo da conta e a dívida do cartão, sem duplicar o gasto. Fechamento e vencimento definem o mês da fatura.</div>`}
function budgetsView(){return `${h('📊 Orçamentos','Limites mensais por categoria de despesas.',actionBtn('new-budget','+ Novo orçamento'))}${data.budgets.length?`<div class="item-grid">${data.budgets.map(b=>{const spent=total(expenses().filter(t=>t.categoryId===b.categoryId)),pc=Math.round(spent/b.limit*100),remain=b.limit-spent;return `<div class="item-card"><div class="line-row">${rowIcon(cat(b.categoryId)?.icon||'📦',cat(b.categoryId)?.color)}${pill(pc+'% utilizado',pc>=100?'red':'green')}</div><h3>${esc(labelCat(b.categoryId))}</h3><div class="item-amount">${money(spent)}</div><div class="hint">Limite: ${money(b.limit)} · ${remain<0?'Excedente':'Disponível'}: ${money(Math.abs(remain))}</div><div class="progress-track" style="margin:13px 0"><div class="progress-fill ${pc>=100?'red':'green'}" style="width:${clamp(pc,0,100)}%"></div></div><div class="item-foot"><button class="btn small" data-action="edit-budget" data-id="${b.id}">Editar</button><button class="btn small danger" data-action="delete-budget" data-id="${b.id}">Excluir</button></div></div>`}).join('')}</div>`:`<div class="card">${empty('🧮','Seu planejamento começa aqui','Um orçamento fixa um limite por categoria e é acompanhado a cada mês.','new-budget','Criar orçamento')}</div>`}`}
function goalsView(){const goalTotal=data.goals.reduce((s,g)=>s+goalSaved(g.id),0);return `${h('🎯 Objetivos',`${money(goalTotal)} reservados para seus planos.`,actionBtn('new-goal','+ Criar objetivo'))}${data.goals.length?`<div class="item-grid">${data.goals.map(g=>{const saved=goalSaved(g.id),pct=clamp(saved/g.target*100,0,100);return `<div class="item-card"><div class="line-row">${rowIcon(g.icon||'🎯',g.color||colors[2])}${pill(Math.round(pct)+'% da meta','green')}</div><h3>${esc(g.name)}</h3><div class="item-amount">${money(saved)}</div><div class="hint">Meta: ${money(g.target)} ${g.deadline?'· até '+fullDate(g.deadline):''}</div><div class="progress-track" style="margin:13px 0"><div class="progress-fill green" style="width:${pct}%"></div></div><div class="item-foot"><button class="btn small" data-action="goal-deposit" data-id="${g.id}">+ Reservar</button><button class="btn small" data-action="goal-withdraw" data-id="${g.id}">Resgatar</button><button class="btn small" data-action="edit-goal" data-id="${g.id}">Editar</button><button class="btn small danger" data-action="delete-goal" data-id="${g.id}">×</button></div></div>`}).join('')}</div>`:`<div class="card">${empty('🏆','Defina sua primeira conquista','Viagem, emergência, estudos ou qualquer outro objetivo: reserve dinheiro de suas contas.','new-goal','Criar objetivo')}</div>`}<div class="notice info" style="margin-top:16px">🔐 Valores reservados são retirados do saldo disponível da conta de origem e passam ao objetivo. Ao resgatar, retornam para uma conta, sem se tornarem receita.</div>`}
function reportsView(){const s=monthStats(),cats=categoryTotals(),accounts=data.accounts.map(a=>({name:a.name,balance:balance(a.id)}));return `${h('🧾 Relatórios',`Consolidação de ${monthLabel(period)}.`,`${actionBtn('csv','↓ Exportar CSV','purple')}${actionBtn('print','⎙ Imprimir','')}`)}${statsCards(s)}<div class="split equal"><section class="card"><h2 class="card-title">Despesas por categoria</h2>${cats.length?`<div class="table-wrap"><table class="simple-table"><thead><tr><th>Categoria</th><th>Valor</th></tr></thead><tbody>${cats.map(c=>`<tr><td><span class="dot" style="background:${c.color}"></span> ${esc(c.name)}</td><td>${money(c.value)}</td></tr>`).join('')}<tr><td><b>Total</b></td><td><b>${money(s.expense)}</b></td></tr></tbody></table></div>`:empty('🧾','Sem despesas','Não há despesas efetivadas neste período.')}</section><section class="card"><h2 class="card-title">Saldos por conta</h2><div class="table-wrap"><table class="simple-table"><thead><tr><th>Conta</th><th>Saldo</th></tr></thead><tbody>${accounts.map(a=>`<tr><td>${esc(a.name)}</td><td>${money(a.balance)}</td></tr>`).join('')}<tr><td><b>Total</b></td><td><b>${money(allBalances())}</b></td></tr></tbody></table></div><div class="divider"></div><h2 class="card-title">Discriminação</h2><div style="margin-top:12px">${statusBreakdown('expense')}</div></section></div><section class="card" style="margin-top:16px"><div class="card-header"><h2 class="card-title">Lançamentos do mês</h2><span class="hint">${monthTx().length} registros</span></div>${monthTx().length?`<div class="rowlist">${monthTx().slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>txRow(t)).join('')}</div>`:empty('📭','Nenhum lançamento','Adicione movimentações para compor seu relatório.')}</section>`}
function chartsView(){const cats=categoryTotals(),hasOut=data.transactions.some(t=>['expense','card_expense'].includes(t.type)),hasIn=data.transactions.some(t=>t.type==='income');return `${h('📈 Gráficos e análises','Tendências e distribuição dos seus lançamentos.')}${statsCards(monthStats())}<div class="split equal"><section class="card"><h2 class="card-title">Despesas por categoria</h2><div style="margin-top:16px">${donutHTML(cats)}</div></section><section class="card"><h2 class="card-title">Despesas por recorrência</h2>${expenses().length?donutHTML([{name:'Recorrentes',color:colors[2],value:total(expenses().filter(t=>t.seriesId))},{name:'Avulsas',color:colors[3],value:total(expenses().filter(t=>!t.seriesId))}].filter(c=>c.value>0)):empty('📊','Sem dados','Registre despesas neste mês para visualizar este gráfico.')}</section></div><section class="card" style="margin-bottom:16px"><h2 class="card-title">Evolução das despesas · 6 meses</h2>${hasOut?trendChart('expense'):empty('📉','Sem histórico de despesas','Os valores surgirão conforme os lançamentos.')}</section><section class="card"><h2 class="card-title">Evolução das receitas · 6 meses</h2>${hasIn?trendChart('income'):empty('📈','Sem histórico de receitas','Os valores surgirão conforme os lançamentos.')}</section>`}
function categoriesView(){const groups=[['expense','Categorias de despesas'],['income','Categorias de receitas']];return `${h('◈ Categorias','Organize seus lançamentos em grupos personalizados.',actionBtn('new-category','+ Nova categoria'))}${groups.map(([type,title])=>`<section class="card" style="margin-bottom:16px"><h2 class="card-title" style="margin-bottom:13px">${title}</h2><div class="item-grid">${data.categories.filter(c=>c.type===type).map(c=>`<div class="data-row">${rowIcon(esc(c.icon),c.color)}<div class="row-body"><b>${esc(c.name)}</b></div><div class="row-actions"><button class="icon-btn" title="Editar" data-action="edit-category" data-id="${c.id}">✎</button><button class="icon-btn" title="Excluir" data-action="delete-category" data-id="${c.id}">×</button></div></div>`).join('')||'<p class="hint">Sem categorias neste tipo.</p>'}</div></section>`).join('')}`}
function calendarView(){const [y,m]=period.split('-').map(Number),first=new Date(y,m-1,1,12).getDay(),last=new Date(y,m,0,12).getDate(),start=(first+6)%7,dayLabels=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];let cells=dayLabels.map(d=>`<div class="calendar-day-head">${d}</div>`).join('');for(let i=0;i<start;i++)cells+='<div class="calendar-day outside" aria-hidden="true"></div>';for(let day=1;day<=last;day++){const dayISO=period+'-'+String(day).padStart(2,'0'),items=data.transactions.filter(t=>t.date===dayISO);cells+=`<button class="calendar-day ${iso()===dayISO?'today':''}" data-action="calendar-day" data-date="${dayISO}" aria-label="${day} de ${monthLabel(period)}, ${items.length} movimentações"><strong>${day}</strong>${items.slice(0,3).map(t=>`<span class="calendar-pill ${t.type==='income'?'green':''}">${t.type==='income'?'+':'−'} ${money(t.amount)}</span>`).join('')}${items.length>3?`<span class="tiny">+ ${items.length-3}</span>`:''}</button>`}return `${h('📅 Calendário',`Vencimentos e movimentações em ${monthLabel(period)}.`,actionBtn('quick','+ Agendar lançamento'))}<section class="card"><div class="calendar-grid">${cells}</div></section><div class="notice info" style="margin-top:16px">📌 Toque em um dia para ver ou cadastrar movimentações. Os cartões são exibidos pela data da compra; as faturas ficam na seção Cartões de crédito.</div>`}
function tagsView(){return `${h('🏷️ Tags','Etiquetas livres para identificar e filtrar seus lançamentos.',actionBtn('new-tag','+ Nova tag'))}<div class="card">${data.tags.length?`<div class="rowlist">${data.tags.map(t=>`<div class="data-row">${rowIcon('🏷️',t.color)}<div class="row-body"><b>${esc(t.name)}</b><div class="hint">${data.transactions.filter(tx=>(tx.tags||[]).includes(t.id)).length} utilização(ões)</div></div><div class="row-actions"><button class="icon-btn" data-action="edit-tag" data-id="${t.id}" title="Editar">✎</button><button class="icon-btn" data-action="delete-tag" data-id="${t.id}" title="Excluir">×</button></div></div>`).join('')}</div>`:empty('🏷️','Nenhuma tag cadastrada','Crie etiquetas como Trabalho, Viagem ou Família.','new-tag','Criar tag')}</div>`}
function loansView(){return `${h('🤝 Empréstimos','Controle manual de contratos e parcelas com amortização fixa (Tabela Price).',actionBtn('new-loan','+ Novo empréstimo'))}${data.loans.length?`<div class="item-grid">${data.loans.map(l=>{const paid=loanPaid(l),pmt=installment(l);return `<div class="item-card"><div class="line-row">${rowIcon('🤝',colors[2])}${pill(paid>=l.months?'Quitado':'Em andamento',paid>=l.months?'green':'gold')}</div><h3>${esc(l.name)}</h3><div class="item-amount">${money(pmt)}<span class="hint"> / mês</span></div><div class="hint">Principal: ${money(l.principal)} · Juros: ${num(l.rate)}% ao mês</div><div class="hint">${paid} de ${l.months} parcelas pagas</div><div class="progress-track" style="margin:13px 0"><div class="progress-fill green" style="width:${clamp(paid/l.months*100,0,100)}%"></div></div><div class="item-foot"><button class="btn small" data-action="pay-loan" data-id="${l.id}" ${paid>=l.months?'disabled':''}>Pagar parcela</button><button class="btn small danger" data-action="delete-loan" data-id="${l.id}">Excluir</button></div></div>`}).join('')}</div>`:`<div class="card">${empty('🤝','Nenhum empréstimo','Registre um empréstimo e acompanhe parcelas e pagamentos.','new-loan','Cadastrar empréstimo')}</div>`}<div class="notice info" style="margin-top:16px">ℹ️ Estimativas de parcelas usam prestações fixas (Price), sem tarifas, seguros ou impostos. Pagamentos reduzem saldo em conta e são tratados como movimentação financeira, não como nova despesa de consumo.</div>`}
function miaView(){return `${h('✨ Sua leitura financeira','Insights automáticos a partir dos dados que você registrar.') }<div class="hero"><div><div class="eyebrow">LEITURA SIMPLES DOS SEUS REGISTROS</div><h1>Entenda o que acontece com seu dinheiro</h1><p>A Análise automática os dados salvos neste navegador usando regras transparentes. Não utiliza inteligência artificial externa nem envia dados a servidores.</p></div><div class="hero-icon">✨</div></div><div class="split equal"><section class="card"><div class="card-header"><h2 class="card-title">Sugestões do mês</h2>${pill(monthLabel(period))}</div>${insightHTML()}</section><section class="card"><div class="card-header"><h2 class="card-title">Saúde financeira</h2></div>${healthHTML()}</section></div>`}
function openFinanceView(){return `${h('◉ Open Finance','Conexões bancárias exigem instituições credenciadas e integração segura.') }<section class="card"><div style="text-align:center;padding:15px"><div style="font-size:56px">🔐</div><h2>Conexões reais ainda não estão disponíveis</h2><p class="muted" style="max-width:600px;margin:0 auto 20px">Este sistema é um aplicativo HTML local. Não solicita senha bancária, não acessa contas e não se conecta a instituições financeiras. Para Open Finance real será necessário um backend, um provedor autorizado e consentimento do usuário.</p><button class="btn primary" data-route="tools">Importar dados manualmente →</button></div></section>`}
function toolsView(){return `${h('🛠️ Ferramentas','Exportação, restauração e cálculos úteis para o dia a dia.')}<div class="two-cols"><section class="card"><h2 class="card-title">📦 Backup e exportação</h2><p class="hint">Exporte todos os registros para JSON ou os lançamentos do mês para CSV. Guarde o arquivo em local seguro.</p><div class="head-actions">${actionBtn('backup','↓ Baixar JSON','primary')}${actionBtn('csv','↓ Baixar CSV','')}</div><div class="divider"></div><label class="form-field">Restaurar backup JSON<input class="field" id="restoreInput" type="file" accept="application/json,.json"></label><p class="hint">Restaurar substitui os dados atuais após confirmação.</p></section><section class="card"><h2 class="card-title">🧮 Simulador de empréstimo</h2><p class="hint">Simulação de parcelas fixas pelo sistema Price, sem impostos ou tarifas.</p><form data-form="calculator" class="form-grid"><label class="form-field">Valor (R$)<input class="field" name="principal" type="number" step="0.01" min="0.01" value="10000" required></label><label class="form-field">Juros ao mês (%)<input class="field" name="rate" type="number" step="0.01" min="0" value="1.5" required></label><label class="form-field">Número de meses<input class="field" name="months" type="number" min="1" max="600" value="24" required></label><div class="form-field" style="justify-content:end"><button class="btn purple" type="submit">Calcular</button></div></form><div id="calcResult" class="soft-card" style="margin-top:12px">Preencha os valores e clique em Calcular.</div></section><section class="card"><h2 class="card-title">📥 Importação de extrato CSV</h2><p class="hint">Aceita CSV com cabeçalho <b>data;descricao;valor;tipo</b>, onde tipo é receita ou despesa. Linhas são importadas como pendentes ou efetivadas conforme a escolha. Confira o arquivo antes de importar.</p><label class="form-field">Arquivo CSV<input type="file" id="csvImportInput" class="field" accept=".csv,text/csv"></label><p class="hint">Requer uma conta cadastrada. Formato de data AAAA-MM-DD ou DD/MM/AAAA; valor positivo em reais. Permite ponto ou vírgula decimal.</p></section><section class="card"><h2 class="card-title">🛡️ Privacidade e dados</h2><p class="hint">O sistema funciona sem servidor. Apagar dados do site/navegador pode eliminar os registros locais.</p><button class="btn danger" data-action="reset">⚠ Apagar todos os registros</button></section><section class="card"><h2 class="card-title">E se eu comprar?</h2><p class="hint">Simule uma compra antes de decidir. Não registra nenhuma movimentação.</p>${pPurchaseUI()}</section></div>`}
function settingsView(){return `${h('⚙️ Configurações','Personalize a experiência neste navegador.')}<div class="split equal"><section class="card"><h2 class="card-title">Seu espaço</h2><form data-form="settings"><label class="form-field" style="margin:15px 0">Como deseja se identificar?<input name="name" class="field" maxlength="42" required value="${attr(data.prefs.name||'Meu espaço')}"></label><label class="form-field">Aparência<select name="theme" class="select"><option value="light" ${data.prefs.theme!=='dark'?'selected':''}>Clara</option><option value="dark" ${data.prefs.theme==='dark'?'selected':''}>Escura</option></select></label><div class="form-actions"><button class="btn primary" type="submit">Salvar configurações</button></div></form></section><section class="card"><h2 class="card-title">Onde estão meus dados?</h2><p class="hint">Os dados estão armazenados em <b>localStorage</b>, neste navegador e dispositivo. Não existem login real, sincronização em nuvem, acesso bancário ou recuperação automática.</p><button class="btn purple" data-route="tools">Fazer backup →</button><button class="btn" style="margin-left:7px" data-action="configure-dashboard">Personalizar tela inicial</button></section></div>`}
function plansView(){return `${h('Planos e preços','Área informativa sobre futuras possibilidades.')}<section class="card"><div style="text-align:center;padding:25px"><div style="font-size:58px">👑</div><h2>Todos os módulos locais estão liberados</h2><p class="muted">Este protótipo não possui assinaturas, cobranças, recursos Premium pagos ou pagamentos integrados. Você pode usar as funcionalidades implementadas sem contratar um plano.</p><button class="btn primary" data-route="dashboard">Voltar ao resumo</button></div></section>`}
function helpView(){return `${h('❔ Ajuda','Respostas rápidas para começar.')}${[['Como começar?','Cadastre contas, registre receitas e despesas e, se quiser, adicione cartões, orçamentos e objetivos. A Carteira principal já é criada com saldo inicial de R$ 0,00.'],['Onde os dados são salvos?','Somente neste navegador, usando localStorage. Use Ferramentas para baixar backups JSON com frequência.'],['Como agendar receitas e despesas?','Ao criar um lançamento, desmarque Efetivado e escolha a data. Para lançar vários meses, marque Repetir mensalmente.'],['Como funcionam os cartões?','Cadastre fechamento e vencimento, lance as compras e depois pague as faturas na área Cartões. A compra conta como despesa uma única vez.'],['O sistema se conecta ao banco?','Não. Open Finance e sincronização não estão implementados. Você pode importar um CSV localmente.'],['Posso usar no celular?','Sim. Abra este arquivo em um navegador moderno. A interface se adapta à tela. Para compartilhar dados entre dispositivos, exporte e restaure um backup.']].map(([q,a])=>`<details class="card" style="margin-bottom:12px"><summary style="font-weight:1000;cursor:pointer">${q}</summary><p class="muted">${a}</p></details>`).join('')}`}
function aboutView(){return `${h('ⓘ Sobre o sistema','Projeto demonstrativo de gestão financeira pessoal.') }<section class="card"><div style="text-align:center;padding:18px"><div style="font-size:65px">💰📊</div><h2>Pouso</h2><p>Gestão financeira pessoal com uma interface leve, colorida e acessível. Controle contas, acompanhe despesas e planeje seus objetivos em um só lugar.</p><p class="hint">Aplicativo autônomo em HTML, CSS e JavaScript, sem bibliotecas externas, backend ou envio de dados. Valores e avisos são calculados com base nos registros locais.</p><div class="chips" style="justify-content:center">${['Contas','Transações','Cartões','Objetivos','Orçamentos','Relatórios','Calendário','Empréstimos','Exportações'].map(c=>pill(c)).join('')}</div></div></section>`}
const views={dashboard,accounts:accountsView,transactions:transactionsView,cards:cardsView,mia:miaView,budgets:budgetsView,goals:goalsView,reports:reportsView,charts:chartsView,categories:categoriesView,calendar:calendarView,tags:tagsView,loans:loansView,openfinance:openFinanceView,tools:toolsView,settings:settingsView,plans:plansView,help:helpView,about:aboutView};
function modal(title,body,wide=false){$('#modalRoot').innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><div class="modal-panel ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${attr(title)}"><div class="modal-header"><h2>${title}</h2><button class="icon-btn" type="button" data-action="close-modal" aria-label="Fechar">×</button></div>${body}</div></div>`;document.body.classList.add('noscroll');$('#modalRoot input:not([type=hidden]),#modalRoot select,#modalRoot button')?.focus({preventScroll:true})}
function closeModal(){$('#modalRoot').innerHTML='';document.body.classList.remove('noscroll')}
function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2900)}
function confirmAction(message,callback){if(window.confirm(message))callback()}
function formActions(){return `<div class="form-actions"><button type="button" class="btn" data-action="close-modal">Cancelar</button><button type="submit" class="btn primary">Salvar ✓</button></div>`}
function options(items,selected=''){return items.map(a=>`<option value="${attr(a.id)}" ${String(selected)===String(a.id)?'selected':''}>${esc(a.name)}</option>`).join('')}
function accountInput(selected='',name='accountId',label='Conta'){return `<label class="form-field">${label}<select class="select" name="${name}" required>${options(data.accounts,selected)}</select></label>`}
function moneyInput(name='amount',v='',label='Valor (R$)'){return `<label class="form-field">${label}<input class="field" name="${name}" type="number" required min="0.01" step="0.01" value="${attr(v)}" placeholder="0,00"></label>`}
function txtInput(name,label,v='',max=90){return `<label class="form-field">${label}<input class="field" name="${name}" maxlength="${max}" required value="${attr(v)}"></label>`}
function dateInput(name='date',v=iso(),label='Data'){return `<label class="form-field">${label}<input class="field" name="${name}" type="date" required value="${attr(v)}"></label>`}
function selectColor(v=colors[2]){const labels=['Terracota','Verde','Malva','Areia','Petróleo','Salmão','Azul','Sálvia'];return `<label class="form-field">Cor<select class="select" name="color">${colors.map((c,i)=>`<option value="${c}" ${c===v?'selected':''}>● ${labels[i]}</option>`).join('')}</select></label>`}
function quickModal(){modal('✨ Novo lançamento',`<p class="muted">O que você deseja registrar?</p><div class="two-cols"><button class="quick-item" data-action="new-income">${rowIcon('+','#43a777')}Receita</button><button class="quick-item" data-action="new-expense">${rowIcon('−','#de6576')}Despesa</button><button class="quick-item" data-action="new-transfer">${rowIcon('↕','#e5a035')}Transferência</button><button class="quick-item" data-action="new-card-expense">${rowIcon('▣','#4c97c2')}Despesa no cartão</button></div>`) }
function transactionForm(type,editId='',prefCard='',prefDate=''){const editing=!!editId,t=editing?get('transactions',editId):null;if(!t&&!['income','expense','transfer','card_expense'].includes(type))return;if(!t&&type==='transfer'&&data.accounts.length<2){toast('Cadastre ao menos duas contas para transferir.');navigate('accounts');return}if(!t&&type==='card_expense'&&!data.cards.length){toast('Cadastre um cartão antes de registrar uma compra.');navigate('cards');return}if(!data.accounts.length&&type!=='card_expense'){toast('Cadastre uma conta primeiro.');navigate('accounts');return}
 const txType=t?.type||type;const categories=data.categories.filter(c=>c.type===(txType==='income'?'income':'expense'));const title=txType==='income'?'receita':txType==='expense'?'despesa':txType==='transfer'?'transferência':'compra no cartão';const tagsChosen=t?.tags||[];
 const desc=`<form data-form="transaction" class="form-grid"><input type="hidden" name="id" value="${attr(t?.id||'')}"><input type="hidden" name="type" value="${txType}">${moneyInput('amount',t?.amount||'')}${dateInput('date',t?.date||prefDate||iso())}${txType==='card_expense'?`<label class="form-field">Cartão<select class="select" name="cardId" required>${options(data.cards,t?.cardId||prefCard)}</select></label>`:accountInput(t?.accountId)}${txType==='transfer'?accountInput(t?.toAccountId||data.accounts.find(a=>a.id!==t?.accountId)?.id||'','toAccountId','Conta de destino'):`<label class="form-field">Categoria<select name="categoryId" class="select" required>${options(categories,t?.categoryId)}</select></label>`}
 <label class="form-field wide">Descrição<input class="field" maxlength="100" name="description" placeholder="Ex.: Mercado, pagamento, transferência..." value="${attr(t?.description||'')}"></label>
 <label class="form-field wide">Observações (opcional)<textarea class="textarea" rows="2" maxlength="500" name="memo" placeholder="Detalhes adicionais">${esc(t?.memo||'')}</textarea></label>
 <div class="form-field wide"><div class="eyebrow" style="margin-bottom:7px">Tags (opcional)</div><div class="chips">${data.tags.length?data.tags.map(tag=>`<label class="check-field" style="margin-right:10px"><input type="checkbox" name="tag" value="${tag.id}" ${tagsChosen.includes(tag.id)?'checked':''}>${esc(tag.name)}</label>`).join(''):'<span class="hint">Nenhuma tag cadastrada.</span>'}</div></div>
 ${txType==='card_expense'?'':`<label class="check-field wide"><input type="checkbox" name="paid" ${!t||t.paid!==false?'checked':''}> Efetivado (dinheiro já movimentado)</label>`}
 ${editing?'':`<label class="check-field wide"><input type="checkbox" name="repeat" id="repeatCheck"> Repetir mensalmente (criar lançamentos futuros)</label><label class="form-field wide hidden" id="repeatCountWrap">Número de meses (inclui este)<input class="field" name="repeatCount" type="number" value="6" min="2" max="24"></label>`}
 <p class="form-help wide">${txType==='card_expense'?'Compras no cartão aparecem em faturas e em despesas do mês da compra.':editing?'Esta edição afeta apenas este lançamento.': 'Lançamentos repetidos são criados em cada mês escolhido; os próximos meses ficam previstos.'}</p>${formActions()}</form>`;
 modal(`${editing?'Editar':'Registrar'} ${title}`,desc,true);
}
function accountForm(id=''){const a=get('accounts',id);modal(a?'Editar conta':'Adicionar conta',`<form data-form="account" class="form-grid"><input type="hidden" name="id" value="${attr(a?.id||'')}">${txtInput('name','Nome da conta',a?.name||'')}<label class="form-field">Tipo<select class="select" name="type"><option value="checking" ${a?.type==='checking'?'selected':''}>Conta bancária</option><option value="savings" ${a?.type==='savings'?'selected':''}>Poupança</option><option value="cash" ${a?.type==='cash'?'selected':''}>Dinheiro / carteira</option></select></label><label class="form-field">Saldo inicial (R$)<input class="field" type="number" name="balance" step="0.01" required value="${attr(a?.balance??0)}"></label>${selectColor(a?.color)}<p class="hint" style="grid-column:1/-1">Editar o saldo inicial altera o saldo atual desta conta, além dos lançamentos já registrados.</p>${formActions()}</form>`)}
function cardForm(id=''){const c=get('cards',id);modal(c?'Editar cartão':'Adicionar cartão',`<form data-form="card" class="form-grid"><input type="hidden" name="id" value="${attr(c?.id||'')}">${txtInput('name','Nome do cartão',c?.name||'')}${moneyInput('limit',c?.limit||'','Limite de crédito (R$)')}<label class="form-field">Dia de fechamento (1–28)<input name="closing" class="field" type="number" min="1" max="28" value="${c?.closing??20}" required></label><label class="form-field">Dia de vencimento (1–28)<input name="due" class="field" type="number" min="1" max="28" value="${c?.due??10}" required></label>${selectColor(c?.color||colors[4])}<div class="form-help">Não informe dados sensíveis do cartão, como número, código de segurança ou senha.</div>${formActions()}</form>`)}
function budgetForm(id=''){const b=get('budgets',id),cats=data.categories.filter(c=>c.type==='expense');if(!cats.length){toast('Crie uma categoria de despesa primeiro.');navigate('categories');return}modal(b?'Editar orçamento':'Novo orçamento',`<form data-form="budget" class="form-grid"><input type="hidden" name="id" value="${attr(b?.id||'')}"><label class="form-field">Categoria<select class="select" name="categoryId">${options(cats,b?.categoryId)}</select></label>${moneyInput('limit',b?.limit||'','Limite mensal (R$)')}<p class="hint wide">Esse limite vale para todos os meses, e o progresso considera despesas efetivadas no mês selecionado.</p>${formActions()}</form>`)}
function goalForm(id=''){const g=get('goals',id);modal(g?'Editar objetivo':'Novo objetivo',`<form data-form="goal" class="form-grid"><input type="hidden" name="id" value="${attr(g?.id||'')}">${txtInput('name','Nome do objetivo',g?.name||'')}${moneyInput('target',g?.target||'','Valor desejado (R$)')}<label class="form-field">Prazo (opcional)<input type="date" name="deadline" class="field" value="${attr(g?.deadline||'')}"></label><label class="form-field">Emoji<input class="field" name="icon" maxlength="6" value="${attr(g?.icon||'🎯')}"></label>${selectColor(g?.color)}<p class="hint wide">Reserve valores depois que o objetivo for criado. Os aportes são transferidos da conta, não registrados como despesa.</p>${formActions()}</form>`)}
function categoryForm(id=''){const c=get('categories',id);modal(c?'Editar categoria':'Nova categoria',`<form data-form="category" class="form-grid"><input type="hidden" name="id" value="${attr(c?.id||'')}">${txtInput('name','Nome',c?.name||'')}<label class="form-field">Tipo<select class="select" name="type"><option value="expense" ${c?.type!=='income'?'selected':''}>Despesa</option><option value="income" ${c?.type==='income'?'selected':''}>Receita</option></select></label><label class="form-field">Ícone (emoji)<input class="field" name="icon" maxlength="6" value="${attr(c?.icon||'📌')}" required></label>${selectColor(c?.color)}${formActions()}</form>`)}
function tagForm(id=''){const t=get('tags',id);modal(t?'Editar tag':'Nova tag',`<form data-form="tag" class="form-grid"><input type="hidden" name="id" value="${attr(t?.id||'')}">${txtInput('name','Nome',t?.name||'')}${selectColor(t?.color||colors[2])}${formActions()}</form>`)}
function goalMoveForm(id,type){const g=get('goals',id);if(!g)return;const saving=type==='goal_deposit';if(!saving&&goalSaved(g.id)<=0){toast('Este objetivo não possui valor reservado.');return}modal(saving?'Reservar para o objetivo':'Resgatar do objetivo',`<form data-form="goal-move" class="form-grid"><input type="hidden" name="goalId" value="${g.id}"><input type="hidden" name="type" value="${type}"><div class="soft-card" style="grid-column:1/-1"><b>${esc(g.name)}</b><div class="hint">Reservado atualmente: ${money(goalSaved(g.id))}</div></div>${moneyInput('amount')}${accountInput('','accountId',saving?'Retirar da conta':'Devolver para a conta')}${formActions()}</form>`)}
function loanForm(){if(!data.accounts.length){toast('Cadastre uma conta primeiro.');navigate('accounts');return}modal('Novo empréstimo',`<form data-form="loan" class="form-grid">${txtInput('name','Nome ou identificação','')}${moneyInput('principal','','Valor principal recebido (R$)')}<label class="form-field">Taxa de juros ao mês (%)<input class="field" name="rate" type="number" min="0" max="100" step="0.01" value="0" required></label><label class="form-field">Número de parcelas<input class="field" name="months" type="number" min="1" max="600" value="12" required></label>${accountInput('','accountId','Conta de recebimento')}<label class="check-field wide"><input type="checkbox" name="disburse" checked> Registrar entrada do empréstimo nesta conta</label><p class="hint wide">A entrada do principal aumenta a conta, mas não é uma receita de trabalho. Parcelas usam estimativa Price.</p>${formActions()}</form>`)}
function invoiceForm(id,key){const c=get('cards',id);if(!c)return;const f=invoice(c,key);if(f.pending<=.009){toast('Esta fatura está quitada.');return}if(!data.accounts.length){toast('Cadastre uma conta para pagar a fatura.');navigate('accounts');return}modal('Pagar fatura',`<form data-form="invoice" class="form-grid"><input type="hidden" name="cardId" value="${c.id}"><input type="hidden" name="invoiceKey" value="${key}"><div class="soft-card wide"><b>${esc(c.name)} · ${monthLabel(key)}</b><div class="hint">Total da fatura: ${money(f.total)} · Pago: ${money(f.paid)} · Em aberto: ${money(f.pending)}</div></div>${moneyInput('amount',f.pending,'Valor a pagar (R$)')}${accountInput('','accountId','Pagar usando')}${dateInput('date',iso(),'Data do pagamento')}<p class="hint wide">O pagamento reduz o saldo da conta e a dívida do cartão, sem duplicar a despesa original.</p>${formActions()}</form>`)}
function loanPaymentForm(id){const l=get('loans',id);if(!l)return;if(loanPaid(l)>=l.months){toast('Todas as parcelas estão pagas.');return}modal('Pagar parcela',`<form data-form="loan-payment" class="form-grid"><input type="hidden" name="loanId" value="${l.id}"><div class="soft-card wide"><b>${esc(l.name)}</b><div class="hint">Parcela ${loanPaid(l)+1}/${l.months} · Valor estimado: ${money(installment(l))}</div></div>${moneyInput('amount',rnd(installment(l)),'Valor pago (R$)')}${accountInput(l.accountId)}${dateInput('date')}${formActions()}</form>`)}
function searchForm(){modal('🔎 Pesquisar transações',`<form data-form="search"><label class="form-field">Palavra-chave<input class="field" name="query" placeholder="Descrição, categoria, conta..." autofocus></label><div class="form-actions"><button class="btn primary" type="submit">Pesquisar</button></div></form>`)}
