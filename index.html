function calendarDayModal(day){const txs=data.transactions.filter(t=>t.date===day);modal('📅 '+fullDate(day),`<div class="rowlist">${txs.map(t=>txRow(t)).join('')||'<p class="muted">Nenhum lançamento neste dia.</p>'}</div><div class="form-actions"><button class="btn" data-action="new-income" data-date="${day}">+ Receita</button><button class="btn primary" data-action="new-expense" data-date="${day}">+ Despesa</button></div>`)}
function replace(arr,item){const index=arr.findIndex(a=>a.id===item.id);if(index>=0)arr[index]=item;else arr.push(item)}
function validateAmount(n){if(!Number.isFinite(n)||n<=0||n>1e12)throw Error('Informe um valor válido, maior que zero.')}
function validateDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s)||Number.isNaN(date(s).getTime())||iso(date(s))!==s)throw Error('Informe uma data válida.')}
function handleForm(name,form){const f=new FormData(form),val=(k)=>String(f.get(k)||'').trim(),numeric=(k)=>amount(val(k)),id=val('id');if(name==='transaction'){
 const type=val('type'),a=numeric('amount'),day=val('date');validateAmount(a);validateDate(day);if(!['income','expense','transfer','card_expense'].includes(type))throw Error('Tipo inválido.');
 const accountId=val('accountId'),toAccountId=val('toAccountId'),cardId=val('cardId'),categoryId=val('categoryId');if(type==='card_expense'){if(!get('cards',cardId))throw Error('Cartão não encontrado.')}else if(!get('accounts',accountId))throw Error('Conta não encontrada.');if(type==='transfer'&&(!get('accounts',toAccountId)||toAccountId===accountId))throw Error('Escolha duas contas diferentes.');if(['income','expense','card_expense'].includes(type)&&(!cat(categoryId)||cat(categoryId).type!==(type==='income'?'income':'expense')))throw Error('Categoria incompatível com o tipo.');
 const base={id:id||uid(),type,amount:rnd(a),date:day,accountId:type==='card_expense'?null:accountId,toAccountId:type==='transfer'?toAccountId:null,cardId:type==='card_expense'?cardId:null,categoryId:['income','expense','card_expense'].includes(type)?categoryId:null,description:val('description').slice(0,100),memo:val('memo').slice(0,500),paid:type==='card_expense'?true:f.has('paid'),tags:f.getAll('tag').map(String).filter(t=>!!get('tags',t))};
 const repeat=!id&&f.has('repeat')?Number(val('repeatCount')):1;if(!Number.isInteger(repeat)||repeat<1||repeat>24)throw Error('A repetição deve ter entre 2 e 24 meses.');if(repeat>1){const seriesId=uid();for(let i=0;i<repeat;i++)data.transactions.push({...base,id:uid(),seriesId,date:plusMonths(day,i),paid:i===0?base.paid:false});}else replace(data.transactions,{...get('transactions',base.id),...base});
 closeModal();persist();toast(id?'Lançamento atualizado!':repeat>1?repeat+' lançamentos mensais criados!':'Lançamento cadastrado!');return;
 }
 if(name==='account'){const nameVal=val('name').slice(0,70),balance=numeric('balance');if(!nameVal||!Number.isFinite(balance))throw Error('Preencha nome e saldo válidos.');replace(data.accounts,{id:id||uid(),name:nameVal,type:val('type'),balance:rnd(balance),color:val('color')});}
 else if(name==='card'){const a=numeric('limit'),closing=Number(val('closing')),due=Number(val('due'));validateAmount(a);if(!val('name')||!Number.isInteger(closing)||!Number.isInteger(due)||closing<1||closing>28||due<1||due>28)throw Error('Preencha os dados do cartão corretamente.');if(id&&get('cards',id)&&get('cards',id).closing!==closing&&data.transactions.some(t=>t.cardId===id))throw Error('Não é possível mudar o fechamento de um cartão com lançamentos existentes.');replace(data.cards,{id:id||uid(),name:val('name').slice(0,70),limit:rnd(a),closing,due,color:val('color')});}
 else if(name==='budget'){const lim=numeric('limit'),categoryId=val('categoryId');validateAmount(lim);if(!cat(categoryId)||cat(categoryId).type!=='expense')throw Error('Categoria inválida.');if(data.budgets.some(b=>b.categoryId===categoryId&&b.id!==id))throw Error('Já existe orçamento para esta categoria.');replace(data.budgets,{id:id||uid(),categoryId,limit:rnd(lim)});}
 else if(name==='goal'){const target=numeric('target');validateAmount(target);if(!val('name'))throw Error('Informe o nome do objetivo.');if(val('deadline'))validateDate(val('deadline'));replace(data.goals,{id:id||uid(),name:val('name').slice(0,70),target:rnd(target),deadline:val('deadline'),icon:val('icon').slice(0,6)||'🎯',color:val('color')});}
 else if(name==='category'){if(!val('name')||!['income','expense'].includes(val('type')))throw Error('Preencha uma categoria válida.');if(id&&get('categories',id)?.type!==val('type')&&data.transactions.some(t=>t.categoryId===id))throw Error('Não altere o tipo de uma categoria utilizada.');replace(data.categories,{id:id||uid(),name:val('name').slice(0,50),type:val('type'),icon:val('icon').slice(0,6)||'📌',color:val('color')});}
 else if(name==='tag'){if(!val('name'))throw Error('Informe o nome da tag.');replace(data.tags,{id:id||uid(),name:val('name').slice(0,45),color:val('color')});}
 else if(name==='goal-move'){const a=numeric('amount'),goalId=val('goalId'),type=val('type'),accountId=val('accountId');validateAmount(a);if(!get('goals',goalId)||!get('accounts',accountId))throw Error('Conta ou objetivo não encontrado.');if(type==='goal_withdraw'&&a>goalSaved(goalId)+.001)throw Error('O resgate não pode superar o saldo reservado.');if(!['goal_deposit','goal_withdraw'].includes(type))throw Error('Operação inválida.');data.transactions.push({id:uid(),type,amount:rnd(a),date:iso(),goalId,accountId,paid:true});}
 else if(name==='invoice'){const a=numeric('amount'),cardId=val('cardId'),key=val('invoiceKey'),accountId=val('accountId');validateAmount(a);if(!get('cards',cardId)||!get('accounts',accountId))throw Error('Cartão ou conta inválido.');if(!/^\d{4}-\d{2}$/.test(key)||a>invoice(get('cards',cardId),key).pending+.009)throw Error('Valor maior do que o saldo em aberto da fatura.');validateDate(val('date'));data.transactions.push({id:uid(),type:'card_payment',amount:rnd(a),date:val('date'),cardId,invoiceKey:key,accountId,paid:true});}
 else if(name==='loan'){const p=numeric('principal'),rate=numeric('rate'),months=Number(val('months')),accountId=val('accountId');validateAmount(p);if(!val('name')||!get('accounts',accountId)||!Number.isFinite(rate)||rate<0||rate>100||!Number.isInteger(months)||months<1||months>600)throw Error('Informe os dados do empréstimo corretamente.');const loanId=uid();data.loans.push({id:loanId,name:val('name').slice(0,70),principal:rnd(p),rate,months,accountId});if(f.has('disburse'))data.transactions.push({id:uid(),type:'loan_in',amount:rnd(p),date:iso(),loanId,accountId,paid:true});}
 else if(name==='loan-payment'){const loanId=val('loanId'),l=get('loans',loanId),a=numeric('amount'),accountId=val('accountId');validateAmount(a);if(!l||!get('accounts',accountId)||loanPaid(l)>=l.months)throw Error('Operação de parcela inválida.');validateDate(val('date'));data.transactions.push({id:uid(),type:'loan_payment',amount:rnd(a),date:val('date'),loanId,accountId,paid:true});}
 else if(name==='dashboard-config'){const holder=form.querySelector('#pConfigOptions'),chosen=new Set(f.getAll('widget'));const order=[...holder.querySelectorAll('[data-widget]')].map(row=>row.dataset.widget);data.prefs.dashboardOrder=order;data.prefs.dashboardWidgets=Object.fromEntries(P_WIDGETS.map(w=>[w.id,chosen.has(w.id)]));const cushion=numeric('safetyCushion');if(!Number.isFinite(cushion)||cushion<0||cushion>1e9)throw Error('Informe uma margem de segurança válida.');data.prefs.safetyCushion=cushion;data.prefs.dashboardDensity=val('dashboardDensity')==='compact'?'compact':'comfortable';}
 else if(name==='settings'){if(!val('name'))throw Error('Informe um nome.');data.prefs.name=val('name').slice(0,42);data.prefs.theme=val('theme')==='dark'?'dark':'light';}
 else if(name==='calculator'){const p=numeric('principal'),rate=numeric('rate'),months=Number(val('months'));validateAmount(p);if(!Number.isFinite(rate)||rate<0||rate>100||!Number.isInteger(months)||months<1||months>600)throw Error('Taxa ou prazo inválido.');const payment=installment({principal:p,rate,months});$('#calcResult').innerHTML=`<b>Prestação: ${money(payment)}</b><div class="hint">Total estimado: ${money(payment*months)} · Juros estimados: ${money(payment*months-p)}</div>`;return;}
 else if(name==='search'){query=val('query');closeModal();navigate('transactions');query=val('query');render();return;}
 else return;
 closeModal();persist();toast('Alterações salvas com sucesso!');
}
function deleteItem(collection,id){const item=get(collection,id);if(!item)return;const labels={accounts:'conta',cards:'cartão',budgets:'orçamento',goals:'objetivo',categories:'categoria',tags:'tag',loans:'empréstimo',transactions:'lançamento'};if(collection==='accounts'&&data.transactions.some(t=>t.accountId===id||t.toAccountId===id))return toast('A conta possui movimentações. Exclua-as antes.');if(collection==='cards'&&data.transactions.some(t=>t.cardId===id))return toast('Este cartão tem movimentações. Exclua-as antes.');if(collection==='goals'&&data.transactions.some(t=>t.goalId===id))return toast('Este objetivo possui reservas. Resgate e exclua os movimentos antes.');if(collection==='loans'&&data.transactions.some(t=>t.loanId===id))return toast('Este empréstimo possui movimentos financeiros. Exclua-os antes.');if(collection==='categories'&&(data.transactions.some(t=>t.categoryId===id)||data.budgets.some(b=>b.categoryId===id)))return toast('Categoria em uso. Remova os vínculos antes.');confirmAction(`Excluir este(a) ${labels[collection]}? Essa ação não pode ser desfeita.`,()=>{data[collection]=data[collection].filter(t=>t.id!==id);if(collection==='tags')data.transactions.forEach(t=>{t.tags=(t.tags||[]).filter(tid=>tid!==id)});persist();toast('Registro excluído.')})}
function settle(id){const t=get('transactions',id);if(!t||t.paid!==false)return;confirmAction('Marcar este lançamento como efetivado?',()=>{t.paid=true;persist();toast('Lançamento efetivado!')})}
function download(text,name,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJSON(){download(JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2),'pouso-backup-'+iso()+'.json','application/json;charset=utf-8');toast('Backup JSON gerado.')}
function csvEscape(x){const s=String(x??'');return '"'+s.replace(/"/g,'""')+'"'}
function exportCSV(){const rows=[['data','tipo','descricao','categoria','conta','cartao','valor','efetivado','observacoes']];for(const t of monthTx().sort((a,b)=>a.date.localeCompare(b.date)))rows.push([t.date,t.type,txTitle(t),labelCat(t.categoryId),accountName(t.accountId),t.cardId?cardName(t.cardId):'',Number(t.amount).toFixed(2).replace('.',','),effective(t)?'sim':'nao',t.memo||'']);download('\ufeff'+rows.map(row=>row.map(csvEscape).join(';')).join('\r\n'),'pouso-'+period+'.csv','text/csv;charset=utf-8');toast('CSV do mês gerado.')}
function validateBackup(d){if(!d||typeof d!=='object')throw Error('Backup inválido.');for(const k of ['accounts','categories','cards','transactions','budgets','goals','loans','tags'])if(!Array.isArray(d[k]))throw Error('Backup incompleto: '+k);if(d.transactions.length>100000)throw Error('Arquivo com registros demais.');for(const t of d.transactions){if(!t||typeof t!=='object'||!t.id||!['income','expense','transfer','card_expense','card_payment','goal_deposit','goal_withdraw','loan_in','loan_payment'].includes(t.type)||!Number.isFinite(Number(t.amount))||Number(t.amount)<0||!/^\d{4}-\d{2}-\d{2}$/.test(t.date||''))throw Error('Há lançamentos inválidos no backup.')}return true}
function restoreJSON(file){const reader=new FileReader();reader.onerror=()=>toast('Não foi possível ler o arquivo.');reader.onload=()=>{try{const parsed=JSON.parse(reader.result);validateBackup(parsed);confirmAction(`Restaurar ${parsed.transactions.length} lançamento(s), substituindo TODOS os dados atuais?`,()=>{data=parsed;data.prefs={...parsed.prefs,name:parsed.prefs?.name||'Meu espaço',theme:parsed.prefs?.theme==='dark'?'dark':'light'};persist();toast('Backup restaurado!')})}catch(e){toast(e.message||'Arquivo inválido.')}};reader.readAsText(file)}
function parseCSVLine(line,delimiter=';'){const out=[];let curr='',quoted=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(quoted&&line[i+1]==='"'){curr+='"';i++}else quoted=!quoted}else if(c===delimiter&&!quoted){out.push(curr);curr=''}else curr+=c}out.push(curr);return out}
function importCSV(file){if(!data.accounts.length)return toast('Cadastre uma conta antes de importar.');const reader=new FileReader();reader.onerror=()=>toast('Não foi possível ler o CSV.');reader.onload=()=>{try{const lines=String(reader.result).replace(/^\ufeff/,'').replace(/\r/g,'').split('\n').filter(Boolean),delimiter=lines[0].includes(';')?';':',',header=parseCSVLine(lines.shift(),delimiter).map(t=>t.toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'')),idx=(s)=>header.indexOf(s);if(['data','descricao','valor','tipo'].some(k=>idx(k)<0))throw Error('Cabeçalho esperado: data;descricao;valor;tipo');if(lines.length>5000)throw Error('Limite de 5.000 linhas por importação.');const imported=[];for(const [i,line] of lines.entries()){const cols=parseCSVLine(line,delimiter);let d=(cols[idx('data')]||'').trim();if(/^\d{2}\/\d{2}\/\d{4}$/.test(d)){const [dd,mm,yy]=d.split('/');d=`${yy}-${mm}-${dd}`}validateDate(d);const ty=(cols[idx('tipo')]||'').toLowerCase().trim(),type=['receita','income'].includes(ty)?'income':['despesa','expense'].includes(ty)?'expense':null;if(!type)throw Error(`Tipo inválido na linha ${i+2}.`);let raw=(cols[idx('valor')]||'').replace(/R\$/g,'').trim();if(raw.includes(',')&&raw.includes('.'))raw=raw.lastIndexOf(',')>raw.lastIndexOf('.')?raw.replace(/\./g,'').replace(',','.'):raw.replace(/,/g,'');else if(raw.includes(','))raw=raw.replace(',','.');const n=Number(raw);validateAmount(n);const defaultCategory=data.categories.find(c=>c.type===type);if(!defaultCategory)throw Error('Cadastre categorias antes de importar.');imported.push({id:uid(),date:d,type,amount:rnd(n),description:(cols[idx('descricao')]||'Importação').slice(0,100),accountId:data.accounts[0].id,categoryId:defaultCategory.id,paid:true,tags:[],memo:'Importado de CSV'});}confirmAction(`Importar ${imported.length} lançamento(s) para ${data.accounts[0].name}? Todos serão efetivados e usarão a primeira categoria do tipo correspondente.`,()=>{data.transactions.push(...imported);persist();toast(imported.length+' lançamento(s) importados!')});}catch(e){toast('CSV não importado: '+e.message)}};reader.readAsText(file,'utf-8')}
function action(event){const el=event.target.closest('[data-action],[data-route]');if(!el)return;if(el.hasAttribute('data-route')){navigate(el.dataset.route);return}const a=el.dataset.action,id=el.dataset.id;try{switch(a){
case'toggle-menu':toggleMenu();break;case'close-menu':closeMenu();break;case'close-modal':closeModal();break;
case'theme':data.prefs.theme=data.prefs.theme==='dark'?'light':'dark';persist();break;
case'month-prev':period=ym(new Date(monthDate(period).getFullYear(),monthDate(period).getMonth()-1,1,12));render();break;
case'month-next':period=ym(new Date(monthDate(period).getFullYear(),monthDate(period).getMonth()+1,1,12));render();break;
case'quick':quickModal();break;case'configure-dashboard':dashboardConfigure();break;case'explain-available':pExplainAvailable();break;case'simulate-purchase':pSimulatePurchase(el);break;case'dash-up':pMoveWidget(el,-1);break;case'dash-down':pMoveWidget(el,1);break;case'dash-preset':pPreset(el.dataset.preset);break;
case'new-income':case'new-expense':case'new-transfer':case'new-card-expense':transactionForm(a.slice(4).replace(/-/g,'_'),'',el.dataset.cardId||'',el.dataset.date||'');break;
case'edit-tx':{const t=get('transactions',id);if(t)transactionForm(t.type,id);break}
case'delete-tx':deleteItem('transactions',id);break;
case'settle-tx':settle(id);break;
case'new-account':accountForm();break;case'edit-account':accountForm(id);break;case'delete-account':deleteItem('accounts',id);break;
case'new-card':cardForm();break;case'edit-card':cardForm(id);break;case'delete-card':deleteItem('cards',id);break;
case'new-budget':budgetForm();break;case'edit-budget':budgetForm(id);break;case'delete-budget':deleteItem('budgets',id);break;
case'new-goal':goalForm();break;case'edit-goal':goalForm(id);break;case'delete-goal':deleteItem('goals',id);break;
case'goal-deposit':goalMoveForm(id,'goal_deposit');break;case'goal-withdraw':goalMoveForm(id,'goal_withdraw');break;
case'new-category':categoryForm();break;case'edit-category':categoryForm(id);break;case'delete-category':deleteItem('categories',id);break;
case'new-tag':tagForm();break;case'edit-tag':tagForm(id);break;case'delete-tag':deleteItem('tags',id);break;
case'new-loan':loanForm();break;case'pay-loan':loanPaymentForm(id);break;case'delete-loan':deleteItem('loans',id);break;
case'pay-invoice':invoiceForm(id,el.dataset.key);break;
case'calendar-day':calendarDayModal(el.dataset.date);break;
case'search':searchForm();break;case'notification':notificationsModal();break;
case'backup':exportJSON();break;case'csv':exportCSV();break;
case'print':window.print();break;
case'reset':confirmAction('APAGAR TODOS os registros e preferências deste navegador? Faça antes um backup JSON. Esta ação é irreversível.',()=>{data=defaultData();period=ym(new Date());navigate('dashboard');persist();toast('Todos os dados foram redefinidos.')});break;
}}catch(err){toast('Não foi possível concluir: '+err.message);console.error(err)}}
document.addEventListener('click',e=>{if(e.target?.id==='modalBackdrop')closeModal();else action(e)});
document.addEventListener('submit',e=>{const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();try{handleForm(form.dataset.form,form)}catch(err){toast(err.message||'Confira os campos.');console.error(err)}});
document.addEventListener('change',e=>{if(e.target.id==='txFilter'){typeFilter=e.target.value;render()}if(e.target.id==='repeatCheck'){$('#repeatCountWrap')?.classList.toggle('hidden',!e.target.checked)}if(e.target.id==='restoreInput'&&e.target.files?.[0])restoreJSON(e.target.files[0]);if(e.target.id==='csvImportInput'&&e.target.files?.[0])importCSV(e.target.files[0])});
document.addEventListener('input',e=>{if(e.target.id==='txSearch'){query=e.target.value;const pos=e.target.selectionStart;render();const input=$('#txSearch');if(input){input.focus();input.setSelectionRange(pos,pos)}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modalBackdrop'))closeModal();else closeMenu()}});
window.addEventListener('hashchange',()=>{const next=(location.hash||'#/dashboard').slice(2).split('?')[0];if(titles[next]&&next!==route){route=next;render()}});
if(!location.hash)history.replaceState(null,'','#/dashboard');
save();render();
})();
</script>
</body>
</html>
